<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hello App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --card: #161616;
      --border: #2a2a2a;
      --accent: #c8f135;
      --text: #f0f0f0;
      --muted: #666;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: drift 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      background: var(--accent);
      top: -100px; left: -100px;
    }
    body::after {
      width: 300px; height: 300px;
      background: #f1c135;
      bottom: -80px; right: -80px;
      animation-delay: -4s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.1); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 0 1px #ffffff08, 0 32px 64px #00000080;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    h1 span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 36px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: #ffffff06;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 16px;
    }
    input::placeholder { color: #444; }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #c8f13520;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px #c8f13540;
    }
    button:active { transform: translateY(0); }

    .output {
      margin-top: 28px;
      padding: 20px;
      background: #ffffff05;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 700;
      color: var(--accent);
      display: none;
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>Say <span>Hello</span></h1>
  <p class="subtitle">Pure HTML · No frameworks · No Python</p>

  <label for="nameInput">Your name</label>
  <input id="nameInput" type="text" placeholder="e.g. Alice"
         maxlength="50" inputmode="text" autocomplete="off"/>

  <button onclick="greet()">Say Hello →</button>

  <div class="output" id="output"></div>
</div>

<script>
  function greet() {
    const name = document.getElementById('nameInput').value.trim();
    const out  = document.getElementById('output');

    out.textContent = name ? `Hello, ${name}! 👋` : 'Please enter your name!';
    out.style.display = 'block';

    // Re-trigger animation
    out.style.animation = 'none';
    out.offsetHeight;
    out.style.animation = '';
  }

  // Allow pressing Enter
  document.getElementById('nameInput')
    .addEventListener('keydown', e => { if (e.key === 'Enter') greet(); });
</script>
</body>
</html>
